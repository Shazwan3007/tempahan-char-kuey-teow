<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dashboard Tempahan</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background: #f5f5f5;

    color: #222;

}


.container {

    max-width: 1000px;

    margin: auto;

    padding: 15px;

}


/* =========================
   HEADER
========================= */

.header {

    background: #222;

    color: white;

    padding: 20px;

    border-radius: 15px;

    margin-bottom: 15px;

}


.header h1 {

    margin: 0 0 5px;

    font-size: 24px;

}


.header p {

    margin: 0;

    color: #ccc;

    font-size: 14px;

}


/* =========================
   STATS
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-bottom: 15px;

}


.stat {

    background: white;

    padding: 16px;

    border-radius: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);

}


.stat-title {

    color: #777;

    font-size: 13px;

}


.stat-value {

    margin-top: 6px;

    font-size: 24px;

    font-weight: bold;

}


/* =========================
   ACTION
========================= */

.actions {

    margin-bottom: 15px;

}


button {

    border: none;

    border-radius: 10px;

    padding: 11px 15px;

    font-weight: bold;

    cursor: pointer;

}


.refresh {

    background: #2563eb;

    color: white;

}


/* =========================
   ORDERS
========================= */

.orders {

    display: flex;

    flex-direction: column;

    gap: 15px;

}


.order {

    background: white;

    padding: 18px;

    border-radius: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);

}


.order-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 12px;

}


.order-number {

    font-weight: bold;

    font-size: 17px;

}


/* =========================
   STATUS
========================= */

.status {

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}


.status-BARU {

    background: #fff3cd;

    color: #856404;

}


.status-DIPROSES {

    background: #dbeafe;

    color: #1d4ed8;

}


.status-SIAP {

    background: #dcfce7;

    color: #166534;

}


.status-SELESAI {

    background: #e5e7eb;

    color: #374151;

}


/* =========================
   ORDER ROW
========================= */

.order-row {

    display: flex;

    justify-content:
        space-between;

    gap: 15px;

    padding: 7px 0;

    border-bottom:
        1px solid #eee;

    font-size: 14px;

}


.order-row:last-child {

    border-bottom: none;

}


.label {

    color: #777;

}


.value {

    text-align: right;

    font-weight: 500;

}


.total {

    color: #e85d04;

    font-weight: bold;

    font-size: 18px;

}


/* =========================
   WHATSAPP
========================= */

.whatsapp-button {

    margin-top: 15px;

}


.whatsapp-button a {

    display: block;

    width: 100%;

    padding: 13px;

    text-align: center;

    text-decoration: none;

    border-radius: 10px;

    background: #25D366;

    color: white;

    font-weight: bold;

}


/* =========================
   STATUS BUTTONS
========================= */

.status-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 10px;

    padding-top: 15px;

    border-top:
        1px solid #eee;

}


.status-buttons button {

    font-size: 12px;

}


.btn-baru {

    background: #fff3cd;

    color: #856404;

}


.btn-proses {

    background: #dbeafe;

    color: #1d4ed8;

}


.btn-siap {

    background: #dcfce7;

    color: #166534;

}


.btn-selesai {

    background: #e5e7eb;

    color: #374151;

}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    padding: 30px;

    color: #777;

}


.empty {

    background: white;

    padding: 40px 20px;

    text-align: center;

    border-radius: 15px;

    color: #777;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .stats {

        grid-template-columns: 1fr;

    }


    .order-header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .order-row {

        align-items:
            flex-start;

    }


    .value {

        max-width: 60%;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>
        📋 Dashboard Tempahan
    </h1>

    <p>
        Char Kuey Teow Udang
    </p>

</div>


<!-- =========================
     STATISTICS
========================= -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">

            Jumlah Tempahan

        </div>


        <div
            class="stat-value"
            id="totalOrders">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">

            Jumlah Pinggan

        </div>


        <div
            class="stat-value"
            id="totalQuantity">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">

            Jumlah Jualan

        </div>


        <div
            class="stat-value"
            id="totalSales">

            RM0.00

        </div>

    </div>


</div>


<!-- =========================
     REFRESH
========================= -->

<div class="actions">

    <button
        class="refresh"
        onclick="loadOrders()">

        🔄 Refresh Tempahan

    </button>

</div>


<!-- =========================
     ORDERS
========================= -->

<div
    id="orders"
    class="orders">

    <div class="loading">

        ⏳ Memuatkan tempahan...

    </div>

</div>


</div>


<!-- =========================
     SUPABASE LIBRARY
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>


// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
    "https://gqbhxdjtcrgsxkqvckrx.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_u6pmXfvHybwjPIw_I7TvrQ_f4xrITaC";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

    );


// ==================================================
// LOAD ORDERS
// ==================================================

async function loadOrders() {


    const ordersElement =
        document.getElementById(
            "orders"
        );


    ordersElement.innerHTML =

        '<div class="loading">' +

        '⏳ Memuatkan tempahan...' +

        '</div>';


    const { data, error } =

        await supabaseClient

        .from("Tempahan Order")

        .select("*")

        .order(

            "created_at",

            {
                ascending: false
            }

        );


    // ERROR

    if (error) {


        console.error(error);


        ordersElement.innerHTML =

            '<div class="empty">' +

            '❌ Gagal memuatkan tempahan.' +

            '<br><br>' +

            escapeHtml(
                error.message
            ) +

            '</div>';


        return;

    }


    // EMPTY

    if (
        !data ||
        data.length === 0
    ) {


        ordersElement.innerHTML =

            '<div class="empty">' +

            '📭 Belum ada tempahan.' +

            '</div>';


        updateStats([]);

        return;

    }


    // STATISTICS

    updateStats(data);


    // CLEAR

    ordersElement.innerHTML = "";


    // DISPLAY ORDERS

    data.forEach(
        function(order) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "order";


            const status =
                order.status ||
                "BARU";


            item.innerHTML =


                '<div class="order-header">' +


                    '<div class="order-number">' +

                        '🧾 Tempahan #' +

                        order.id +

                    '</div>' +


                    '<div class="status status-' +

                        escapeHtml(
                            status
                        ) +

                    '">' +

                        escapeHtml(
                            status
                        ) +

                    '</div>' +


                '</div>' +



                '<div class="order-row">' +

                    '<span class="label">' +

                        '👤 Nama' +

                    '</span>' +


                    '<span class="value">' +

                        escapeHtml(
                            order.name
                        ) +

                    '</span>' +

                '</div>' +



                '<div class="order-row">' +

                    '<span class="label">' +

                        '📱 WhatsApp' +

                    '</span>' +


                    '<span class="value">' +

                        escapeHtml(
                            order.phone
                        ) +

                    '</span>' +

                '</div>' +



                '<div class="order-row">' +

                    '<span class="label">' +

                        '🍜 Pesanan' +

                    '</span>' +


                    '<span class="value">' +

                        escapeHtml(
                            order.order
                        ) +

                    '</span>' +

                '</div>' +



                '<div class="order-row">' +

                    '<span class="label">' +

                        '🔢 Kuantiti' +

                    '</span>' +


                    '<span class="value">' +

                        Number(
                            order.quantity
                        ) +

                    '</span>' +

                '</div>' +



                '<div class="order-row">' +

                    '<span class="label">' +

                        '🕐 Pickup' +

                    '</span>' +


                    '<span class="value">' +

                        escapeHtml(
                            order.pickup_time
                        ) +

                    '</span>' +

                '</div>' +



                '<div class="order-row">' +

                    '<span class="label">' +

                        '📝 Catatan' +

                    '</span>' +


                    '<span class="value">' +

                        escapeHtml(
                            order.notes ||
                            "-"
                        ) +

                    '</span>' +

                '</div>' +



                '<div class="order-row">' +

                    '<span class="label">' +

                        '💰 Jumlah' +

                    '</span>' +


                    '<span class="value total">' +

                        'RM' +

                        Number(
                            order.total
                        ).toFixed(2) +

                    '</span>' +

                '</div>' +



                // WHATSAPP

                '<div class="whatsapp-button">' +


                    '<a ' +

                        'href="' +

                        buatWhatsApp(

                            order.phone,

                            order.name,

                            order.pickup_time

                        ) +

                        '" ' +

                        'target="_blank">' +


                        '💬 WhatsApp Pelanggan' +


                    '</a>' +


                '</div>' +



                // STATUS BUTTONS

                '<div class="status-buttons">' +


                    '<button ' +

                        'class="btn-baru" ' +

                        'onclick="updateStatus(' +

                            order.id +

                            ', \'BARU\')">' +


                        '🟡 BARU' +


                    '</button>' +



                    '<button ' +

                        'class="btn-proses" ' +

                        'onclick="updateStatus(' +

                            order.id +

                            ', \'DIPROSES\')">' +


                        '🔵 DIPROSES' +


                    '</button>' +



                    '<button ' +

                        'class="btn-siap" ' +

                        'onclick="updateStatus(' +

                            order.id +

                            ', \'SIAP\')">' +


                        '🟢 SIAP' +


                    '</button>' +



                    '<button ' +

                        'class="btn-selesai" ' +

                        'onclick="updateStatus(' +

                            order.id +

                            ', \'SELESAI\')">' +


                        '⚫ SELESAI' +


                    '</button>' +


                '</div>';


            ordersElement.appendChild(
                item
            );

        }

    );

}


// ==================================================
// UPDATE STATUS
// ==================================================

async function updateStatus(
    id,
    status
) {


    const { error } =

        await supabaseClient

        .from("Tempahan Order")

        .update({

            status: status

        })

        .eq(
            "id",
            id
        );


    if (error) {


        console.error(error);


        alert(

            "Status gagal dikemaskini:\n\n" +

            error.message

        );


        return;

    }


    // Refresh dashboard

    loadOrders();

}


// ==================================================
// WHATSAPP
// ==================================================

function buatWhatsApp(
    phone,
    name,
    pickup
) {


    let nombor =

        String(phone)
        .replace(
            /\D/g,
            ""
        );


    // Tukar 0123456789
    // kepada 60123456789

    if (
        nombor.startsWith("0")
    ) {


        nombor =

            "60" +

            nombor.substring(1);

    }


    const mesej =


        "Hai " +

        name +

        ", 😊\n\n" +


        "Tempahan Char Kuey Teow Udang anda sudah diterima.\n\n" +


        "🕐 Waktu pickup: " +

        pickup +

        "\n\n" +


        "Terima kasih kerana membuat tempahan! ❤️";


    return


        "https://wa.me/" +

        nombor +

        "?text=" +

        encodeURIComponent(
            mesej
        );

}


// ==================================================
// STATISTICS
// ==================================================

function updateStats(
    data
) {


    let quantity = 0;

    let sales = 0;


    data.forEach(
        function(order) {


            quantity +=

                Number(
                    order.quantity
                ) || 0;


            sales +=

                Number(
                    order.total
                ) || 0;

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =

        data.length;


    document.getElementById(
        "totalQuantity"
    ).textContent =

        quantity;


    document.getElementById(
        "totalSales"
    ).textContent =

        "RM" +

        sales.toFixed(2);

}


// ==================================================
// SECURITY
// ==================================================

function escapeHtml(
    value
) {


    if (

        value === null ||

        value === undefined

    ) {


        return "";

    }


    return String(value)


        .replace(
            /&/g,
            "&amp;"
        )


        .replace(
            /</g,
            "&lt;"
        )


        .replace(
            />/g,
            "&gt;"
        )


        .replace(
            /"/g,
            "&quot;"
        )


        .replace(
            /'/g,
            "&#039;"
        );

}


// ==================================================
// START
// ==================================================

loadOrders();


</script>


</body>

</html>
