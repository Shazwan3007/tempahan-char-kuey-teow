<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Tempahan</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

/* HEADER */

.header {
    background: #222;
    color: white;

    padding: 20px;

    border-radius: 15px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

.header p {
    margin: 0;
    color: #ccc;
    font-size: 14px;
}

/* STATS */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}

.stat {
    background: white;

    padding: 18px;

    border-radius: 15px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);
}

.stat-title {
    color: #777;
    font-size: 13px;
}

.stat-value {
    margin-top: 6px;

    font-size: 25px;
    font-weight: bold;
}

/* ACTION */

.actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 10px;

    padding: 12px 18px;

    font-weight: bold;

    cursor: pointer;
}

.refresh {
    background: #2563eb;
    color: white;
}

.refresh:active {
    transform: scale(.98);
}

/* ORDER */

.orders {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.order {
    background: white;

    padding: 18px;

    border-radius: 15px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);
}

.order-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;

    margin-bottom: 12px;
}

.order-number {
    font-weight: bold;
    font-size: 17px;
}

.status {
    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    background: #fff3cd;
    color: #856404;

    font-size: 12px;
    font-weight: bold;
}

.order-row {
    display: flex;

    justify-content: space-between;

    padding: 6px 0;

    border-bottom: 1px solid #eee;

    font-size: 14px;
}

.order-row:last-child {
    border-bottom: none;
}

.label {
    color: #777;
}

.value {
    text-align: right;
    font-weight: 500;
}

.total {
    color: #e85d04;
    font-weight: bold;
    font-size: 18px;
}

/* EMPTY */

.empty {
    background: white;

    padding: 40px 20px;

    text-align: center;

    border-radius: 15px;

    color: #777;
}

/* LOADING */

.loading {
    text-align: center;

    padding: 30px;

    color: #777;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 12px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .order-header {
        flex-direction: column;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <h1>
        📋 Dashboard Tempahan
    </h1>

    <p>
        Char Kuey Teow Udang
    </p>

</div>


<!-- STATS -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            Jumlah Tempahan
        </div>

        <div
            id="totalOrders"
            class="stat-value">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Jumlah Pinggan
        </div>

        <div
            id="totalQuantity"
            class="stat-value">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Jumlah Jualan
        </div>

        <div
            id="totalSales"
            class="stat-value">

            RM0.00

        </div>

    </div>

</div>


<!-- ACTION -->

<div class="actions">

    <button
        class="refresh"
        onclick="loadOrders()">

        🔄 Refresh Tempahan

    </button>

</div>


<!-- ORDERS -->

<div
    id="orders"
    class="orders">

    <div class="loading">

        ⏳ Memuatkan tempahan...

    </div>

</div>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
    "https://gqbhxdjtcrgsxkqvckrx.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_u6pmXfvHybwjPIw_I7TvrQ_f4xrITaC";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==================================================
// LOAD ORDERS
// ==================================================

async function loadOrders() {

    const ordersElement =
        document.getElementById(
            "orders"
        );


    ordersElement.innerHTML =

        '<div class="loading">' +
        '⏳ Memuatkan tempahan...' +
        '</div>';


    const { data, error } =
        await supabaseClient

        .from("Tempahan Order")

        .select("*")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    // ERROR

    if (error) {

        console.error(error);

        ordersElement.innerHTML =

            '<div class="empty">' +

            '❌ Gagal memuatkan tempahan.' +

            '<br><br>' +

            error.message +

            '</div>';

        return;
    }


    // EMPTY

    if (!data || data.length === 0) {

        ordersElement.innerHTML =

            '<div class="empty">' +

            '📭 Belum ada tempahan.' +

            '</div>';

        updateStats([]);

        return;
    }


    // STATS

    updateStats(data);


    // ORDERS

    ordersElement.innerHTML = "";


    data.forEach(
        function(order, index) {

            const orderNumber =
                "CKT-" +
                String(
                    data.length - index
                ).padStart(4, "0");


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "order";


            item.innerHTML =

                '<div class="order-header">' +

                '<div class="order-number">' +

                '🧾 ' +
                orderNumber +

                '</div>' +

                '<div class="status">' +

                'BARU' +

                '</div>' +

                '</div>' +


                '<div class="order-row">' +

                '<span class="label">' +
                'Nama' +
                '</span>' +

                '<span class="value">' +
                escapeHtml(order.name) +
                '</span>' +

                '</div>' +


                '<div class="order-row">' +

                '<span class="label">' +
                'WhatsApp' +
                '</span>' +

                '<span class="value">' +
                escapeHtml(order.phone) +
                '</span>' +

                '</div>' +


                '<div class="order-row">' +

                '<span class="label">' +
                'Pesanan' +
                '</span>' +

                '<span class="value">' +
                escapeHtml(order.order) +
                '</span>' +

                '</div>' +


                '<div class="order-row">' +

                '<span class="label">' +
                'Kuantiti' +
                '</span>' +

                '<span class="value">' +
                order.quantity +
                '</span>' +

                '</div>' +


                '<div class="order-row">' +

                '<span class="label">' +
                'Pickup' +
                '</span>' +

                '<span class="value">' +
                escapeHtml(order.pickup_time) +
                '</span>' +

                '</div>' +


                '<div class="order-row">' +

                '<span class="label">' +
                'Catatan' +
                '</span>' +

                '<span class="value">' +
                escapeHtml(order.notes || "-") +
                '</span>' +

                '</div>' +


                '<div class="order-row">' +

                '<span class="label">' +
                'Jumlah' +
                '</span>' +

                '<span class="value total">' +

                'RM' +
                Number(order.total)
                .toFixed(2) +

                '</span>' +

                '</div>';


            ordersElement.appendChild(
                item
            );

        }
    );

}


// ==================================================
// STATS
// ==================================================

function updateStats(data) {

    let quantity = 0;

    let sales = 0;


    data.forEach(
        function(order) {

            quantity +=
                Number(order.quantity) || 0;

            sales +=
                Number(order.total) || 0;

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
        data.length;


    document.getElementById(
        "totalQuantity"
    ).textContent =
        quantity;


    document.getElementById(
        "totalSales"
    ).textContent =
        "RM" +
        sales.toFixed(2);

}


// ==================================================
// SECURITY
// ==================================================

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ==================================================
// START
// ==================================================

loadOrders();

</script>

</body>
</html>
