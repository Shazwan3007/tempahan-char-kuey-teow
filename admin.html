<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin - Dashboard Tempahan</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* =========================
LOGIN
========================= */

.login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

.login-box p {
    text-align: center;
    color: #777;
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    font-size: 14px;
}

.input-group input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

.login-button {
    width: 100%;
    border: none;
    background: #2563eb;
    color: white;
    padding: 14px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
}

.login-error {
    background: #fee2e2;
    color: #b91c1c;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
    font-size: 14px;
}

/* =========================
HEADER
========================= */

.header {
    background: #222;
    color: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0 0 5px;
}

.header p {
    margin: 0;
    color: #ccc;
}

.admin-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #444;
    gap: 10px;
}

.admin-email {
    font-size: 13px;
    color: #ccc;
    word-break: break-word;
}

.logout {
    border: none;
    background: #dc2626;
    color: white;
    padding: 9px 12px;
    border-radius: 8px;
    font-weight: bold;
}

/* =========================
STATISTICS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: white;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.stat-title {
    font-size: 13px;
    color: #777;
}

.stat-value {
    font-size: 23px;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================
BUTTON
========================= */

.refresh {
    border: none;
    background: #2563eb;
    color: white;
    padding: 12px 15px;
    border-radius: 10px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* =========================
ORDER
========================= */

.order {
    background: white;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.order-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
}

.order-number {
    font-weight: bold;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-BARU {
    background: #fff3cd;
    color: #856404;
}

.status-DIPROSES {
    background: #dbeafe;
    color: #1d4ed8;
}

.status-SIAP {
    background: #dcfce7;
    color: #166534;
}

.status-SELESAI {
    background: #e5e7eb;
    color: #374151;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.label {
    color: #777;
}

.value {
    text-align: right;
    max-width: 60%;
}

.total {
    color: #e85d04;
    font-size: 18px;
    font-weight: bold;
}

/* =========================
WHATSAPP
========================= */

.whatsapp {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #25D366;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

/* =========================
STATUS BUTTONS
========================= */

.status-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
}

.status-buttons button {
    border: none;
    padding: 10px;
    border-radius: 9px;
    font-weight: bold;
}

.baru {
    background: #fff3cd;
}

.proses {
    background: #dbeafe;
}

.siap {
    background: #dcfce7;
}

.selesai {
    background: #e5e7eb;
}

.empty {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
}

/* =========================
HIDDEN
========================= */

#dashboard {
    display: none;
}

/* =========================
MOBILE
========================= */

@media(max-width:600px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .order-header {
        flex-direction: column;
        gap: 8px;
    }

    .admin-bar {
        flex-direction: column;
        align-items: stretch;
    }

    .logout {
        width: 100%;
    }

}

</style>

</head>

<body>


<!-- =========================
LOGIN PAGE
========================= -->

<div id="loginPage" class="login-container">

<div class="login-box">

<h1>🔐 Admin Login</h1>

<p>Dashboard Tempahan</p>


<div id="loginError"
class="login-error">
</div>


<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Email admin"
autocomplete="email">

</div>


<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">

</div>


<button
class="login-button"
onclick="loginAdmin()">

🔐 Login

</button>

</div>

</div>


<!-- =========================
DASHBOARD
========================= -->

<div id="dashboard">

<div class="container">

<div class="header">

<h1>📋 Dashboard Tempahan</h1>

<p>Char Kuey Teow Udang</p>


<div class="admin-bar">

<div class="admin-email"
id="adminEmail">
Admin
</div>


<button
class="logout"
onclick="logoutAdmin()">

🚪 Logout

</button>

</div>

</div>


<div class="stats">

<div class="stat">

<div class="stat-title">
Jumlah Tempahan
</div>

<div class="stat-value"
id="totalOrders">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Jumlah Pinggan
</div>

<div class="stat-value"
id="totalQuantity">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Jumlah Jualan
</div>

<div class="stat-value"
id="totalSales">
RM0.00
</div>

</div>

</div>


<button
class="refresh"
onclick="loadOrders()">

🔄 Refresh Tempahan

</button>


<div id="orders">

</div>

</div>

</div>


<!-- =========================
SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://gqbhxdjtcrgsxkqvckrx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u6pmXfvHybwjPIw_I7TvrQ_f4xrITaC";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
LOGIN
========================= */

async function loginAdmin() {

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


const errorBox =
document.getElementById("loginError");


errorBox.style.display = "none";


if(!email || !password) {

errorBox.textContent =
"Sila masukkan email dan password.";

errorBox.style.display = "block";

return;

}


const result =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});


if(result.error) {

errorBox.textContent =
"Login gagal: " +
result.error.message;

errorBox.style.display = "block";

return;

}


showDashboard(result.data.user);

}


/* =========================
SHOW DASHBOARD
========================= */

function showDashboard(user) {

document.getElementById(
"loginPage"
).style.display = "none";


document.getElementById(
"dashboard"
).style.display = "block";


document.getElementById(
"adminEmail"
).textContent =
"👤 " + (user.email || "Admin");


loadOrders();

}


/* =========================
LOGOUT
========================= */

async function logoutAdmin() {

const result =
await supabaseClient.auth.signOut();


if(result.error) {

alert(
"Gagal logout:\n\n" +
result.error.message
);

return;

}


document.getElementById(
"dashboard"
).style.display = "none";


document.getElementById(
"loginPage"
).style.display = "flex";


document.getElementById(
"email"
).value = "";


document.getElementById(
"password"
).value = "";

}


/* =========================
CHECK LOGIN
========================= */

async function checkLogin() {

const result =
await supabaseClient.auth.getSession();


const session =
result.data.session;


if(session && session.user) {

showDashboard(
session.user
);

}

}


/* =========================
AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
function(event, session) {

if(session && session.user) {

showDashboard(
session.user
);

}

else {

document.getElementById(
"dashboard"
).style.display = "none";


document.getElementById(
"loginPage"
).style.display = "flex";

}

});


/* =========================
LOAD ORDERS
========================= */

async function loadOrders() {

const container =
document.getElementById("orders");

container.innerHTML =
'<div class="empty">⏳ Memuatkan...</div>';


const result =
await supabaseClient
.from("Tempahan Order")
.select("*")
.order(
"created_at",
{ ascending:false }
);


if(result.error) {

container.innerHTML =
'<div class="empty">❌ ' +
result.error.message +
'</div>';

return;

}


const data = result.data;


if(!data || data.length === 0) {

container.innerHTML =
'<div class="empty">' +
'📭 Belum ada tempahan.' +
'</div>';

updateStats([]);

return;

}


updateStats(data);

container.innerHTML = "";


data.forEach(function(order) {

const status =
order.status || "BARU";


const div =
document.createElement("div");

div.className = "order";


div.innerHTML = `

<div class="order-header">

<div class="order-number">

🧾 Tempahan #${order.id}

</div>

<div class="status status-${status}">

${status}

</div>

</div>


<div class="row">

<span class="label">👤 Nama</span>

<span class="value">
${escapeHtml(order.name)}
</span>

</div>


<div class="row">

<span class="label">📱 WhatsApp</span>

<span class="value">
${escapeHtml(order.phone)}
</span>

</div>


<div class="row">

<span class="label">🍜 Pesanan</span>

<span class="value">
${escapeHtml(order.order)}
</span>

</div>


<div class="row">

<span class="label">🔢 Kuantiti</span>

<span class="value">
${order.quantity}
</span>

</div>


<div class="row">

<span class="label">🕐 Pickup</span>

<span class="value">
${escapeHtml(order.pickup_time)}
</span>

</div>


<div class="row">

<span class="label">📝 Catatan</span>

<span class="value">
${escapeHtml(order.notes || "-")}
</span>

</div>


<div class="row">

<span class="label">💰 Jumlah</span>

<span class="value total">

RM${Number(order.total).toFixed(2)}

</span>

</div>


<button
class="whatsapp"
onclick="whatsappPelanggan(
'${escapeJs(order.phone)}',
'${escapeJs(order.name)}'
)">

💬 WhatsApp Pelanggan

</button>


<div class="status-buttons">

<button
class="baru"
onclick="updateStatus(${order.id}, 'BARU')">

🟡 BARU

</button>


<button
class="proses"
onclick="updateStatus(${order.id}, 'DIPROSES')">

🔵 DIPROSES

</button>


<button
class="siap"
onclick="updateStatus(${order.id}, 'SIAP')">

🟢 SIAP

</button>


<button
class="selesai"
onclick="updateStatus(${order.id}, 'SELESAI')">

⚫ SELESAI

</button>

</div>

`;


container.appendChild(div);

});

}


/* =========================
WHATSAPP
========================= */

function whatsappPelanggan(
phone,
name
) {

let nombor =
String(phone || "")
.replace(/\D/g, "");


if(nombor.startsWith("0")) {

nombor =
"60" +
nombor.substring(1);

}


if(!nombor) {

alert(
"Nombor WhatsApp pelanggan tidak ditemui."
);

return;

}


const mesej =
"Hai " +
name +
", 😊\n\n" +

"🍜 Tempahan Char Kuey Teow Udang anda sudah SIAP!\n\n" +

"Boleh datang ambil sekarang. Terima kasih! ❤️";


const url =
"https://wa.me/" +
nombor +
"?text=" +
encodeURIComponent(mesej);


window.open(
url,
"_blank"
);

}


/* =========================
UPDATE STATUS
========================= */

async function updateStatus(
id,
status
) {

const result =
await supabaseClient
.from("Tempahan Order")
.update({
status:status
})
.eq(
"id",
id
);


if(result.error) {

alert(
"Status gagal dikemaskini:\n\n" +
result.error.message
);

return;

}


loadOrders();

}


/* =========================
STATISTICS
========================= */

function updateStats(data) {

let quantity = 0;

let sales = 0;


data.forEach(function(order) {

quantity +=
Number(order.quantity) || 0;

sales +=
Number(order.total) || 0;

});


document.getElementById(
"totalOrders"
).textContent =
data.length;


document.getElementById(
"totalQuantity"
).textContent =
quantity;


document.getElementById(
"totalSales"
).textContent =
"RM" +
sales.toFixed(2);

}


/* =========================
ESCAPE HTML
========================= */

function escapeHtml(value) {

if(value === null ||
value === undefined) {

return "";

}

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
ESCAPE JAVASCRIPT
========================= */

function escapeJs(value) {

if(value === null ||
value === undefined) {

return "";

}

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g,"\\n")
.replace(/\r/g,"");

}


/* =========================
START
========================= */

checkLogin();

</script>

</body>

</html>
